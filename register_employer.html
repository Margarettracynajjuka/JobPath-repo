<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JOB PATH|Home </title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <!-- Navigation -->
  <nav>
    <div class="logo">JOB<span>PATH</span></div>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Jobs</a></li>
      <li><a href="#">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav> 
  
 <body>
   <form>
    <p>Register
     <div class="mb-3">
    <label for="InputFirstName" class="form-label">First Name</label>
    <input type="text" class="form-control" id="InputFirstName" aria-describedby="firstnameHelp">
 </div>
  </p>

  <p>
     <div class="mb-3">
    <label for="InputLastName" class="form-label">Last Name</label>
    <input type="text" class="form-control" id="InputLastName" aria-describedby="lastnameHelp">
     </div>
  </p>

  <p>
     <div class="mb-3">
    <label for="gender" class="form-label">Gender</label>
    <select class="form-control" id="gender" aria-describedby="gender">
      <option value="" selected disabled>Select gender</option>
      <option value="male">Male</option>
      <option value="female">Female</option>
      <option value="other">Other</option>
    </select>
     </div>
  </p>

  <p>
     <div class="mb-3">
    <label for="InputInstitution" class="form-label">Name of Institution</label>
    <input type="text" class="form-control" id="InputInstitution" aria-describedby="institutionHelp">
     </div>
  </p>

  <p>
     <div class="mb-3">
    <label for="Position title" class="form-label">Position title at Institution</label>
    <select class="form-control" id="position" aria-describedby="position">
      <option value="" selected disabled>Select position</option>
      <option value="human_resource">Human Resource Manager</option>
      <option value="project_manager">Project Manager</option>
      <option value="assistant_hr">Assistant Human Resource</option>
      <option value="assistant_manager">Assistant Manager</option>
    </select>
     </div>
  </p>



  <div class="mb-3">
    <label for="InputEmail" class="form-label">Email address</label>
    <input type="email" class="form-control" id="InputEmail" aria-describedby="emailHelp">
    <div id="emailHelp" class="form-text">Use your company email.</div>
  </div>
  </p>  

  
  <div class="mb-3">
    <label for="InputPassword" class="form-label">Password</label>
    <input type="password" class="form-control" id="InputPassword">
  </div>


</form>
  <!-- Footer -->
  <footer>
    <p>&copy; 2026 JOB PATH. All rights reserved.</p>
  </footer>

</body>
</html>
