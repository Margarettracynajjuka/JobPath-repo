<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JOB PATH | Homepage</title>

  <!-- Bootstrap 5 CSS + Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <!-- Poppins, same family as the logo -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Your own styles (loaded after Bootstrap so they can override it) -->
  <link rel="stylesheet" href="style2.css" />

  <style>
    .action-card{cursor:pointer;transition:transform .2s,box-shadow .2s}
    .action-card:hover,.action-card:focus-visible{transform:translateY(-6px);box-shadow:0 .75rem 1.5rem rgba(0,0,0,.15)!important;outline:2px solid #0d6efd}
    .card-cta{display:inline-block;font-weight:600;color:#0d6efd}
    .drop-zone{border:2px dashed #adb5bd;border-radius:1rem;padding:2rem 1rem;text-align:center;cursor:pointer;transition:.2s;background:#f8f9fa}
    .drop-zone:hover,.drop-zone.dragover{border-color:#0d6efd;background:#e7f1ff}
    .drop-zone i{font-size:2.5rem;color:#0d6efd}
    .file-item{display:flex;align-items:center;gap:.75rem;padding:.6rem .8rem;border:1px solid #dee2e6;border-radius:.6rem;margin-top:.5rem}
    .file-item .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  </style>
</head>
<body>

  <!-- 1. NAVIGATION BAR -->
  <nav class="navbar navbar-expand-lg bg-white sticky-top border-bottom">
    <div class="container">
      <!-- Left: logo -->
      <a class="navbar-brand" href="#home">
        <img src="logo.jpeg" alt="JOB PATH logo" class="brand-logo" />
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Right: links -->
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto gap-lg-2 fw-medium">
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="home.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="jobs.html">Jobs</a></li>
          <li class="nav-item"><a class="nav-link" href="#">About</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- 2. HEADER / HERO SECTION -->
  <header id="home" class="hero text-white">
    <div class="container py-5">
      <div class="row align-items-center g-5 py-lg-4">

        <div class="col-lg-7">
          <h1 class="display-3 fw-bold lh-1 mb-4">Acquire your<br />Dream Job</h1>
          <p class="lead fs-4 mb-5 hero-tagline">Get hired easily using JOB PATH</p>

          <div class="d-flex flex-column flex-sm-row gap-3">
            <a href="#" class="btn btn-warning btn-lg px-5 fw-semibold rounded-pill shadow">
              <i class="bi bi-search me-2"></i>Browse Jobs
            </a>
            <div class="dropdown">
              <button class="btn btn-outline-light btn-lg px-5 fw-semibold rounded-pill dropdown-toggle w-100" type="button"
                      data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-person-plus me-2"></i>Register
              </button>
              <ul class="dropdown-menu shadow border-0 rounded-3 p-2">
                <li><h6 class="dropdown-header">Register as</h6></li>
                <li><a class="dropdown-item rounded-2 py-2" href="#" data-account-type="Job Seeker"><i class="bi bi-person-badge me-2 text-primary"></i>Job Seeker</a></li>
                <li><a class="dropdown-item rounded-2 py-2" href="#" data-account-type="Employer"><i class="bi bi-building me-2 text-warning"></i>Employer</a></li>
              </ul>
            </div>
          </div>
        </div>

      </div>
    </div>
  </header>

 
  <!-- 4. FOOTER (BOTTOM) -->
  <footer class="py-4 border-top begin">
    <div class="container d-flex flex-column flex-md-row align-items-center justify-content-between gap-3">
      <img src="logo.jpeg" alt="JOB PATH logo" class="footer-logo" />
      <p class="mb-0 text-secondary">&copy; 2026 JOB PATH. All Rights Reserved.</p>
    </div>
  </footer>

  <!-- Bootstrap JS (needed for the mobile menu button) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
